[package]
name = "gba_streamer"
version = "0.1.0"
edition = "2021"
autobenches = false

[dependencies]
libloading = "0.8"
tokio = { version = "1", features = ["full"] }
warp = "0.3"
tokio-tungstenite = "0.21"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
lz4_flex = "0.11"

[lib]
name = "gba_streamer"
path = "src/lib.rs"

[[bin]]
name = "gba_streamer"
path = "src/main.rs"

[[bin]]
name = "bench_ghosting_and_m2p"
path = "benches/bench_ghosting_and_m2p.rs"

[[bin]]
name = "bench_master_udp"
path = "benches/bench_master_udp.rs"

[[bin]]
name = "bench_ab_scorecard"
path = "benches/bench_ab_scorecard.rs"

[[bin]]
name = "bench_anguna_colors"
path = "benches/bench_anguna_colors.rs"

[[bin]]
name = "bench_16color_gain"
path = "benches/bench_16color_gain.rs"

[[bin]]
name = "verify_audio"
path = "benches/verify_audio.rs"

[[bin]]
name = "record_wav"
path = "benches/record_wav.rs"

[[bin]]
name = "bench_server_pacing"
path = "benches/bench_server_pacing.rs"

[[bin]]
name = "bench_runahead"
path = "benches/bench_runahead.rs"

[[bin]]
name = "bench_localhost_pacing"
path = "benches/bench_localhost_pacing.rs"
